<!-- templates/partials/header.html -->
<!-- Requires: Tailwind CDN + DM Sans + Sora fonts (already loaded in base template) -->

<style>
  .nav-link-item {
    display: flex; align-items: center; gap: 6px;
    padding: 2px 5px; border-radius: 8px;
    font-size: 14px; font-weight: 500; color: #475569;
    text-decoration: none; white-space: nowrap;
    transition: background 0.15s, color 0.15s;
  }
  .nav-link-item:hover { background: #f1f5f9; color: #1e293b; }
  .nav-link-item.active { background: #ede9fe; color: #4f46e5; }

  .nav-dropdown { position: relative; }
  .nav-dropdown-menu {
    display: none; position: absolute; top: calc(100% + 6px); left: 0;
    background: white; border: 1px solid #e2e8f0; border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.08); min-width: 180px;
    padding: 6px; z-index: 100;
  }
  .nav-dropdown:hover .nav-dropdown-menu,
  .nav-dropdown.open .nav-dropdown-menu { display: block; }

  .nav-dropdown-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; border-radius: 8px; font-size: 13px;
    font-weight: 500; color: #475569; text-decoration: none;
    transition: background 0.12s, color 0.12s;
  }
  .nav-dropdown-item:hover { background: #f8fafc; color: #4f46e5; }

  .nav-search-wrap { position: relative; }
  .nav-search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #94a3b8; pointer-events: none; }
  .nav-search-input {
    padding: 7px 12px 7px 32px; border: 1.5px solid #e2e8f0; border-radius: 8px;
    font-size: 13px; font-family: 'DM Sans', sans-serif; color: #1e293b;
    background: #f8fafc; outline: none; transition: border-color 0.15s, background 0.15s;
    width: 200px;
  }
  .nav-search-input:focus { border-color: #6366f1; background: white; }
  .nav-search-input::placeholder { color: #94a3b8; }

  .notif-btn {
    position: relative; width: 36px; height: 36px; border-radius: 8px;
    border: 1.5px solid #e2e8f0; background: white; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: #64748b; transition: border-color 0.15s, color 0.15s;
  }
  .notif-btn:hover { border-color: #6366f1; color: #4f46e5; }
  .notif-badge {
    position: absolute; top: -4px; right: -4px;
    background: #ef4444; color: white; border-radius: 999px;
    font-size: 10px; font-weight: 600; min-width: 16px; height: 16px;
    display: flex; align-items: center; justify-content: center;
    padding: 0 4px; border: 2px solid white; font-family: 'DM Sans', sans-serif;
  }

  .profile-btn {
    display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 4px;
    border-radius: 10px; border: 1.5px solid #e2e8f0; background: white;
    cursor: pointer; text-decoration: none; transition: border-color 0.15s;
  }
  .profile-btn:hover { border-color: #6366f1; }
  .profile-avatar {
    width: 28px; height: 28px; border-radius: 8px; object-fit: cover;
  }
  .profile-name { font-size: 13px; font-weight: 600; color: #1e293b; }
  .profile-role { font-size: 11px; color: #94a3b8; font-weight: 400; }

  .profile-dropdown-menu {
    display: none; position: absolute; top: calc(100% + 8px); right: 0;
    background: white; border: 1px solid #e2e8f0; border-radius: 14px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.1); min-width: 200px;
    padding: 8px; z-index: 100;
  }
  .profile-dropdown.open .profile-dropdown-menu { display: block; }

  .profile-header {
    padding: 10px 12px 12px; border-bottom: 1px solid #f1f5f9; margin-bottom: 6px;
  }

  .profile-dd-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; border-radius: 8px; font-size: 13px;
    font-weight: 500; color: #475569; text-decoration: none;
    transition: background 0.12s, color 0.12s;
  }
  .profile-dd-item:hover { background: #f8fafc; color: #1e293b; }
  .profile-dd-item.danger { color: #ef4444; }
  .profile-dd-item.danger:hover { background: #fee2e2; color: #dc2626; }

  .navbar-divider { height: 1px; background: #f1f5f9; margin: 6px 0; }

  /* Mobile menu */
  #mobileMenu { display: none; }
  #mobileMenu.open { display: block; }

  @media (max-width: 1024px) {
    #desktopNav { display: none !important; }
    #mobileMenuBtn { display: flex !important; }
  }
  @media (min-width: 1025px) {
    #mobileMenuBtn { display: none !important; }
  }
</style>

<script>
  function toggleProfile(e) {
    e.preventDefault();
    document.getElementById('profileDropdown').classList.toggle('open');
  }
  function toggleMobile() {
    document.getElementById('mobileMenu').classList.toggle('open');
  }
  document.addEventListener('click', function(e) {
    const pd = document.getElementById('profileDropdown');
    if (pd && !pd.contains(e.target)) pd.classList.remove('open');
  });
</script>
