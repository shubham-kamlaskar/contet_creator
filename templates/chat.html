<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern AI Chat UI</title>


  <!-- markdown parser -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<!-- Add typography -->
<script src="https://cdn.tailwindcss.com?plugins=typography"></script>

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }

    .typing span {
      animation: blink 1.4s infinite both;
    }

    .typing span:nth-child(2) {
      animation-delay: .2s;
    }

    .typing span:nth-child(3) {
      animation-delay: .4s;
    }


  .ai-message {
    line-height: 1.6;
    font-size: 15px;
  }

  .ai-message h1,
  .ai-message h2,
  .ai-message h3,
  .ai-message h4 {
    margin-top: 12px;
    margin-bottom: 8px;
    font-weight: 700;
    line-height: 1.3;
  }

  .ai-message h1 {
    font-size: 24px;
  }

  .ai-message h2 {
    font-size: 20px;
  }

  .ai-message h3 {
    font-size: 18px;
  }

  .ai-message p {
    margin: 6px 0;
  }

  .ai-message ul,
  .ai-message ol {
    padding-left: 20px;
    margin: 8px 0;
  }

  .ai-message li {
    margin: 4px 0;
  }

  .ai-message strong {
    color: white;
  }

  .ai-message code {
    background: #18181b;
    padding: 2px 6px;
    border-radius: 6px;
    font-size: 14px;
  }

  .ai-message pre {
    background: #09090b;
    padding: 12px;
    border-radius: 12px;
    overflow-x: auto;
    margin-top: 10px;
  }

  .ai-message blockquote {
    border-left: 3px solid #6366f1;
    padding-left: 12px;
    color: #a1a1aa;
    margin: 10px 0;
  }

  .copy-btn {
  font-size: 13px;
  color: #a1a1aa;
  transition: 0.2s;
}

.copy-btn:hover {
  color: white;
}

    @keyframes blink {
      0% { opacity: .2; }
      20% { opacity: 1; }
      100% { opacity: .2; }
    }
  </style>
</head>

<body class="bg-zinc-950 text-white h-screen overflow-hidden">

  <div class="flex h-screen">

    <!-- Sidebar -->
    <aside class="hidden md:flex w-72 bg-zinc-900 border-r border-zinc-800 flex-col">

      <div class="p-5 border-b border-zinc-800">
        <button
          class="w-full bg-white text-black font-semibold py-3 rounded-xl hover:scale-[1.02] transition"
        >
          + New Chat
        </button>
      </div>

      <div class="flex-1 overflow-y-auto p-4 space-y-3 scrollbar-hide">

        <div class="bg-zinc-800 rounded-xl p-3 cursor-pointer hover:bg-zinc-700 transition">
          <p class="text-sm font-medium">How to build AI app?</p>
        </div>

        <div class="bg-zinc-900 rounded-xl p-3 cursor-pointer hover:bg-zinc-800 transition">
          <p class="text-sm text-zinc-400">Marketing strategy ideas</p>
        </div>

      </div>

      <div class="p-4 border-t border-zinc-800">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-gradient-to-r from-violet-500 to-indigo-500"></div>
          <div>
            <p class="font-medium">Shubham</p>
            <p class="text-xs text-zinc-400">Pro User</p>
          </div>
        </div>
      </div>

    </aside>

    <!-- Main Chat Area -->
    <main class="flex-1 flex flex-col bg-zinc-950">

      <!-- Header -->
      <header class="h-16 border-b border-zinc-800 flex items-center px-6 justify-between">
        <div>
          <h1 class="font-semibold text-lg">AI Assistant</h1>
          <p class="text-sm text-zinc-400">Modern QnA Chatbot</p>
        </div>

        <div class="flex items-center gap-3">
          <button
  id="clearChat"
  class="bg-zinc-800 px-4 py-2 rounded-xl hover:bg-zinc-700 transition"
>
  Clear
</button>
        </div>
      </header>

      <!-- Messages -->
      <section
        id="chatContainer"
        class="flex-1 overflow-y-auto p-6 space-y-6 scrollbar-hide"
      >

        
      </section>

      <!-- Input Area -->
      <footer class="border-t border-zinc-800 p-5 bg-zinc-950">

        <form id="chatForm" class="max-w-4xl mx-auto">

          <div class="flex items-end gap-3 bg-zinc-900 border border-zinc-800 rounded-2xl p-3">

            <textarea
              id="messageInput"
              rows="1"
              placeholder="Ask anything..."
              class="flex-1 bg-transparent outline-none resize-none text-white placeholder:text-zinc-500 max-h-40"
            ></textarea>

            <button
              type="submit"
              class="bg-white text-black px-5 py-3 rounded-xl font-semibold hover:scale-105 transition"
            >
              Send
            </button>

          </div>

        </form>

      </footer>

    </main>

  </div>

  <script>

    const form = document.getElementById("chatForm");
    const input = document.getElementById("messageInput");
    const chatContainer = document.getElementById("chatContainer");

    // Auto resize textarea
    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = input.scrollHeight + "px";
    });

    // Add Message Function
    function addMessage(message, sender = "user") {

      const wrapper = document.createElement("div");

      if (sender === "user") {

        wrapper.innerHTML = `
          <div class="flex justify-end">
            <div class="bg-white text-black rounded-2xl px-5 py-4 max-w-2xl">
              ${marked.parse(message)}
            </div>
          </div>
        `;

      } else {

        wrapper.innerHTML = `
          <div class="flex items-start gap-3">
            <div class="w-10 h-10 rounded-full bg-indigo-500 flex items-center justify-center font-bold">
              AI
            </div>

            <div class="ai-message bg-zinc-900 border border-zinc-800 rounded-2xl px-5 py-4 text-zinc-200 overflow-x-auto">
              ${marked.parse(message)}
            </div>

            <div class="flex items-center gap-3 mt-4">

  <button
    class="copy-btn text-xs text-zinc-400 hover:text-white transition"
    onclick='copyMessage(this)'
    data-message=${JSON.stringify(message)}
  >
    <i class="fa-solid fa-copy"></i>
  </button>

</div>
          </div>
        `;
      }

      chatContainer.appendChild(wrapper);

      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // Typing Loader
    function showTyping() {

      const typing = document.createElement("div");
      typing.id = "typingLoader";

      typing.innerHTML = `
        <div class="flex items-start gap-3">
          <div class="w-10 h-10 rounded-full bg-indigo-500 flex items-center justify-center font-bold">
            AI
          </div>

          <div class="bg-zinc-900 border border-zinc-800 rounded-2xl px-5 py-4">
            <div class="typing flex gap-1">
              <span>•</span>
              <span>•</span>
              <span>•</span>
            </div>
          </div>
        </div>
      `;

      chatContainer.appendChild(typing);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function removeTyping() {
      const typing = document.getElementById("typingLoader");
      if (typing) typing.remove();
    }

    // Submit
    form.addEventListener("submit", async (e) => {

      e.preventDefault();

      const message = input.value.trim();

      if (!message) return;

      // Add user message
      addMessage(message, "user");

      // Clear input
      input.value = "";
      input.style.height = "auto";

      // Show loader
      showTyping();

      try {

        /*
          Replace with your backend endpoint
        */

        const response = await fetch("/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message
          })
        });

        const data = await response.json();

        removeTyping();

        // Add AI response
        addMessage(data.reply || "No response received", "bot");

      } catch (error) {

        removeTyping();

        addMessage(
          "Something went wrong while connecting to server.",
          "bot"
        );

        console.error(error);
      }

    });

    const clearBtn = document.getElementById("clearChat");

function copyMessage(button) {

  const message = button.dataset.message;

  navigator.clipboard.writeText(message);

  const originalText = button.innerText;

  button.innerText = "Copied";

  setTimeout(() => {
    button.innerText = originalText;
  }, 1500);

}

clearBtn.addEventListener("click", () => {

  const confirmClear = confirm("Clear all chats?");

  if (confirmClear) {
    chatContainer.innerHTML = "";
  }

});

  </script>

</body>
</html>
